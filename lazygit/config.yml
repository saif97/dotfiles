# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

# Defaults
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#default
# https://github.com/jesseduffield/lazygit/blob/master/docs/keybindings/Custom_Keybindings.md

git:
  pagers:
    - # https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_Pagers.md#delta
      colorArg: always
      pager: delta --dark --paging=never
  mainBranches:
    - master
    - main
    - develop
  # NOTE: lazygit tokenizes this with str.ToArgv and runs it WITHOUT a shell, and that
  # tokenizer strips backslashes even inside single quotes. So no pipes to sed/perl and
  # no regex escapes here -- they arrive corrupted. Glyphs must be literal UTF-8.
  # %d is required for --decorate to show anything under a custom --pretty=format.
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=format:'%C(red)%h%C(reset)%C(auto)%d%C(reset) %C(bold green)(%ar)%C(reset) %s %C(dim white) %an%C(reset)' {{branchName}}"
  log:
    # lazygit draws its own box-drawing graph in the commits panel -- no shelling out.
    showGraph: always
    order: topo-order
  # Prefill the commit message from the branch name.
  # https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#predefined-commit-message-prefix
  # feature/CP-1234-thing -> "CP-1234 "; branches without a CP-#### are left alone.
  commitPrefix:
    - pattern: "^(?:[^/]+/)?(CP-\\d+).*$"
      replace: "$1 "
keybinding:
  universal:
    prevItem: u
    nextItem: e
    edit: I
  status:
    checkForUpdate: ''
gui:
  nerdFontsVersion: "3"
  showCommandLog: false
  expandFocusedSidePanel: true
  shrinkSidePanelsToContent: true
  # showFileStatusHeaders: true
  # showFileTree: false
customCommands:
  - key: "U"
    description: "Update submodules"
    command: "git submodule update --init --recursive"
    context: "global"
    loadingText: "Updating submodules..."
    output: log
