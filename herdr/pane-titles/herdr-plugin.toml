id = "saif.herdr-pane-titles"
name = "Herdr pane titles"
version = "0.1.0"
description = "Show each agent's terminal title on its pane border."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# herdr shows display_agent on the pane border, in place of the agent label.
# Agent panes show their terminal title, other panes their workspace name,
# each after the short hostname.
# Plugins get no event for a terminal title change (pane.updated is refused),
# so an agent title catches up on the next agent state change.
[[events]]
on = "pane.agent_detected"
command = ["bash", "sync.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "sync.sh"]

[[events]]
on = "pane.created"
command = ["bash", "sync.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "sync.sh"]

[[events]]
on = "workspace.renamed"
command = ["bash", "sync.sh"]
